services:
  backend:
    build: ./backend
    container_name: xai_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./dataset:/app/dataset
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: postgres:15
    container_name: xai_db
    environment:
      POSTGRES_DB: brainscan_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d brainscan_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      
volumes:
  db_data:
  