version: '3.8'

services:
  backend:
    build: ./backend
    container_name: xai_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./dataset:/app/dataset
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
  
  db:
    image: postgres:15
    container_name: xai_db
    environment:
      POSTGRES_DB: brainscan_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"